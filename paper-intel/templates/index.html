<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Assistant - Powered by RAG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .metrics-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .metric-card h4 {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .metric-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .metric-card .label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 1024px) {
            .results-container {
                grid-template-columns: 1fr;
            }
        }

        .result-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease-in;
        }

        .result-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .result-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .result-item h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .result-item .meta {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .result-item .snippet {
            color: #444;
            line-height: 1.6;
        }

        .answer-box {
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid #00acc1;
        }

        .answer-box h3 {
            color: #00838f;
            margin-bottom: 15px;
        }

        .answer-box .text {
            color: #333;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 8px;
        }

        .badge-success {
            background: #4caf50;
            color: white;
        }

        .badge-info {
            background: #2196f3;
            color: white;
        }

        .badge-warning {
            background: #ff9800;
            color: white;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .repo-card, .model-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .repo-card:hover, .model-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        .repo-card h4, .model-card h4 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .repo-card .stars {
            color: #f39c12;
            font-weight: bold;
        }

        .sources-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .source-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .source-tag:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #c62828;
            margin: 20px 0;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4caf50;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 AI Research Assistant</h1>
            <p>Powered by RAG | Search → Analyze → Discover Resources</p>
        </div>

        <div class="search-box">
            <div class="search-input-group">
                <input type="text" 
                       class="search-input" 
                       id="searchQuery" 
                       placeholder="Ask me anything about research papers..."
                       onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="executeSearch()">
                    🔍 Search
                </button>
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('full')" id="mode-full">
                    🚀 Full Pipeline
                </button>
                <button class="mode-btn" onclick="setMode('search')" id="mode-search">
                    📚 Search Only
                </button>
                <button class="mode-btn" onclick="setMode('rag')" id="mode-rag">
                    💡 RAG Answer
                </button>
                <button class="mode-btn" onclick="setMode('recommend')" id="mode-recommend">
                    🎯 Recommend Resources
                </button>
            </div>

            <div class="metrics-dashboard" id="metricsDashboard" style="display:none;">
                <!-- Metrics will be populated here -->
            </div>
        </div>

        <div id="resultsArea"></div>
    </div>

    <script>
        let currentMode = 'full';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeSearch();
            }
        }

        function executeSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                alert('Please enter a search query');
                return;
            }

            const endpoints = {
                'search': '/api/search',
                'rag': '/api/query',
                'recommend': '/api/recommend',
                'full': '/api/full_pipeline'
            };

            showLoading();
            
            fetch(endpoints[currentMode], {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                } else {
                    displayResults(data, currentMode);
                    if (data.test_metrics) {
                        displayMetrics(data.test_metrics);
                    }
                }
            })
            .catch(error => {
                showError(`Network error: ${error.message}`);
            });
        }

        function showLoading() {
            document.getElementById('resultsArea').innerHTML = `
                <div class="result-panel loading">
                    <div class="spinner"></div>
                    <h3>Processing your query...</h3>
                    <p>Running ${currentMode} pipeline</p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('resultsArea').innerHTML = `
                <div class="error-message">
                    <h3>❌ Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        function displayMetrics(metrics) {
            const dashboard = document.getElementById('metricsDashboard');
            dashboard.style.display = 'grid';
            
            const retrieval = metrics.retrieval;
            const generation = metrics.generation;
            
            dashboard.innerHTML = `
                <div class="metric-card">
                    <h4>Precision @5</h4>
                    <div class="value">${retrieval.precision_at_5}</div>
                    <div class="label">Retrieved relevance</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${retrieval.precision_at_5 * 100}%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>Recall @5</h4>
                    <div class="value">${retrieval.recall_at_5}</div>
                    <div class="label">Coverage of relevant docs</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${retrieval.recall_at_5 * 100}%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>MRR Score</h4>
                    <div class="value">${retrieval.mrr}</div>
                    <div class="label">Ranking quality</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${retrieval.mrr * 100}%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>NDCG @5</h4>
                    <div class="value">${retrieval.ndcg_at_5}</div>
                    <div class="label">Normalized ranking</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${retrieval.ndcg_at_5 * 100}%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>ROUGE-L</h4>
                    <div class="value">${generation.rouge_l}</div>
                    <div class="label">Answer similarity</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${generation.rouge_l * 100}%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h4>Overall Score</h4>
                    <div class="value">${metrics.overall_quality_score}%</div>
                    <div class="label">System quality</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${metrics.overall_quality_score}%"></div>
                    </div>
                </div>
            `;
        }

        function displayResults(data, mode) {
            let html = '';

            if (mode === 'search') {
                html = displaySearchResults(data);
            } else if (mode === 'rag') {
                html = displayRAGResults(data);
            } else if (mode === 'recommend') {
                html = displayRecommendations(data);
            } else if (mode === 'full') {
                html = displayFullPipeline(data);
            }

            document.getElementById('resultsArea').innerHTML = html;
        }

        function displaySearchResults(data) {
            return `
                <div class="result-panel">
                    <h2>📚 Search Results (${data.count} found)</h2>
                    <p style="color: #666; margin-bottom: 20px;">
                        Processing time: ${data.processing_time}s
                    </p>
                    ${data.results.map((r, i) => `
                        <div class="result-item">
                            <h3>[${r.rank}] ${r.file}</h3>
                            <div class="meta">
                                <span class="badge badge-info">Score: ${r.score}</span>
                            </div>
                            <div class="snippet">${r.snippet}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function displayRAGResults(data) {
            return `
                <div class="result-panel">
                    <h2>💡 Generated Answer</h2>
                    <div class="answer-box">
                        <h3>Answer:</h3>
                        <div class="text">${data.answer}</div>
                    </div>
                    
                    <h3 style="margin: 20px 0 10px 0;">📖 Sources:</h3>
                    <div class="sources-list">
                        ${data.sources.map(s => `
                            <div class="source-tag" title="${s.snippet}">
                                ${s.file} (${s.score})
                            </div>
                        `).join('')}
                    </div>
                    
                    <p style="color: #666; margin-top: 20px;">
                        Processing time: ${data.processing_time}s
                    </p>
                </div>
            `;
        }

        function displayRecommendations(data) {
            const recs = data.recommendations;
            return `
                <div class="results-container">
                    <div class="result-panel">
                        <h2>🤗 HuggingFace Models</h2>
                        ${recs.huggingface_models.map(m => `
                            <div class="model-card">
                                <h4>${m.name}</h4>
                                <p><span class="badge badge-info">${m.task}</span></p>
                                <p>💙 ${m.likes.toLocaleString()} likes | ⬇️ ${m.downloads.toLocaleString()} downloads</p>
                                <a href="${m.url}" target="_blank" style="color: #667eea;">View Model →</a>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>⭐ GitHub Repositories</h2>
                        ${recs.github_repos.map(r => `
                            <div class="repo-card">
                                <h4>${r.name}</h4>
                                <p class="stars">⭐ ${r.stars.toLocaleString()} stars</p>
                                <p>${r.description}</p>
                                <a href="${r.url}" target="_blank" style="color: #667eea;">View Repo →</a>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>🌐 Web Resources</h2>
                        ${recs.web_resources.map(w => `
                            <div class="result-item">
                                <h3>${w.title}</h3>
                                <p>${w.snippet}</p>
                                <a href="${w.url}" target="_blank" style="color: #667eea;">Visit →</a>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>🔑 Search Keywords</h2>
                        <p><strong>HuggingFace:</strong> ${recs.keywords.huggingface.join(', ')}</p>
                        <p><strong>GitHub:</strong> ${recs.keywords.github.join(', ')}</p>
                        <p><strong>Web:</strong> ${recs.keywords.web.join(', ')}</p>
                    </div>
                </div>
            `;
        }

        function displayFullPipeline(data) {
            const pipeline = data.pipeline;
            return `
                <div class="success-message">
                    <h3>✅ Full Pipeline Completed</h3>
                    <p>Total processing time: ${data.total_processing_time}s</p>
                </div>
                
                <div class="result-panel">
                    <h2>💡 Answer</h2>
                    <div class="answer-box">
                        <div class="text">${pipeline.answer.text}</div>
                    </div>
                    <div class="sources-list">
                        ${pipeline.answer.sources.map(s => `
                            <div class="source-tag">${s}</div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="results-container">
                    <div class="result-panel">
                        <h2>📚 Top Research Papers (${pipeline.search.count})</h2>
                        ${pipeline.search.results.map(r => `
                            <div class="result-item">
                                <h3>[${r.rank}] ${r.file}</h3>
                                <div class="meta">
                                    <span class="badge badge-info">Score: ${r.score}</span>
                                </div>
                                <div class="snippet">${r.snippet}</div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>🤗 HuggingFace Models</h2>
                        ${pipeline.recommendations.huggingface_models.slice(0,3).map(m => `
                            <div class="model-card">
                                <h4>${m.name}</h4>
                                <p><span class="badge badge-info">${m.task}</span></p>
                                <p>💙 ${m.likes.toLocaleString()} | ⬇️ ${m.downloads.toLocaleString()}</p>
                                <a href="${m.url}" target="_blank">View →</a>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>⭐ GitHub Repos</h2>
                        ${pipeline.recommendations.github_repos.slice(0,3).map(r => `
                            <div class="repo-card">
                                <h4>${r.name}</h4>
                                <p class="stars">⭐ ${r.stars.toLocaleString()}</p>
                                <p>${r.description.substring(0, 100)}...</p>
                                <a href="${r.url}" target="_blank">View →</a>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="result-panel">
                        <h2>🌐 Resources</h2>
                        ${pipeline.recommendations.web_resources.slice(0,3).map(w => `
                            <div class="result-item">
                                <h3>${w.title}</h3>
                                <a href="${w.url}" target="_blank">Visit →</a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // Show welcome message
        window.onload = function() {
            document.getElementById('resultsArea').innerHTML = `
                <div class="result-panel" style="text-align: center;">
                    <h2>👋 Welcome to AI Research Assistant</h2>
                    <p style="font-size: 1.1em; color: #666; margin: 20px 0;">
                        Enter your research query above to get started!
                    </p>
                    <div style="text-align: left; margin-top: 30px;">
                        <h3>✨ What I can do:</h3>
                        <ul style="line-height: 2;">
                            <li>🔍 <strong>Search</strong> through 36 research papers (3,383 chunks)</li>
                            <li>💡 <strong>Answer</strong> questions using RAG (Retrieval-Augmented Generation)</li>
                            <li>🎯 <strong>Recommend</strong> HuggingFace models, GitHub repos, and tutorials</li>
                            <li>📊 <strong>Show real-time evaluation metrics</strong> (P@K, R@K, NDCG, ROUGE, BLEU)</li>
                        </ul>
                        
                        <h3 style="margin-top: 30px;">💡 Try these examples:</h3>
                        <div style="display: grid; gap: 10px; margin-top: 15px;">
                            <button class="btn btn-secondary" onclick="document.getElementById('searchQuery').value='What is Retrieval-Augmented Generation?'; executeSearch();">
                                What is RAG?
                            </button>
                            <button class="btn btn-secondary" onclick="document.getElementById('searchQuery').value='How does hybrid retrieval improve accuracy?'; executeSearch();">
                                Hybrid retrieval methods
                            </button>
                            <button class="btn btn-secondary" onclick="document.getElementById('searchQuery').value='Transformer models for semantic search'; executeSearch();">
                                Transformer models
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };
    </script>
</body>
</html>
