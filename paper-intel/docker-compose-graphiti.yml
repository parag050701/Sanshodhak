version: '3.8'

services:
  graphiti:
    image: zepai/graphiti:latest
    container_name: graphiti_service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphiti123
    depends_on:
      - neo4j
    networks:
      - graphiti_network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.22.0
    container_name: neo4j_graphiti
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_graphiti_data:/data
    environment:
      - NEO4J_AUTH=neo4j/graphiti123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    networks:
      - graphiti_network
    restart: unless-stopped

networks:
  graphiti_network:
    driver: bridge

volumes:
  neo4j_graphiti_data:
